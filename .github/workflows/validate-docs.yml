name: Validate Docs Folder
on: [push, pull_request]

jobs:
  check-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout files
        uses: actions/checkout@v4

      - name: Verify /docs folder exists
        run: |
          if [ ! -d "Docs" ]; then echo "ERROR: Docs folder missing!"; exit 1; fi

      - name: Check for required files inside Docs
        run: |
          cd Docs
          ls -la
          # Check that you have at least these 3 types of files
          has_png=$(ls *.png 2>/dev/null || true)
          has_sql=$(ls *.sql 2>/dev/null || true)
          has_doc=$(ls *.pdf *.docx *.txt 2>/dev/null || true)
          
          if [ -z "$has_png" ]; then echo " Missing ERD image (.png)"; fi
          if [ -z "$has_sql" ]; then echo " Missing SQL script (.sql)"; exit 1; fi
          if [ -z "$has_doc" ]; then echo " Missing planning document"; fi
          echo " All required files found in Docs folder!"
